; PHP settings for hosting (Railway). Loaded through the variable PHP_INI_SCAN_DIR=":/app/deploy/php".
; Videos (max 20 MB) arrive in 1 MB chunks; lesson resources (35 MB), assignment files (25 MB)
; and course books (200 MB) are sent in a single request.
upload_max_filesize = 210M
post_max_size = 220M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
